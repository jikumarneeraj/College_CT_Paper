<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Paper</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .container h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #4CAF50;
        }

        .container p {
            text-align: center;
            font-size: 1rem;
            margin-bottom: 20px;
            color: #555;
        }

        .form-frame {
            border: none;
            width: 100%;
            height: 800px;
            border-radius: 8px;
        }

        .btn-back {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .btn-back:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add New Paper</h1>
        <p>Please fill out the form below to upload new papers.</p>

        <iframe 
            src="https://docs.google.com/forms/d/e/1FAIpQLSeNHtG8D6SGADvH4uWgvQEtfnHuOnpgz5XJCMNQ81i-R9Ca4w/viewform?embedded=true"
            class="form-frame"
            frameborder="0" 
            marginheight="0" 
            marginwidth="0">
            Loading…
        </iframe>

        <a href="index.html" class="btn-back">Go Back to Home</a>
    </div>
</body>
</html>
